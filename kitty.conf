# ======================
#  Kitty config (KDE/X11)
# ======================

# --- Font ---
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# --- UI / Window ---
remember_window_size  yes
initial_window_width  120c
initial_window_height 32c
window_padding_width  10
hide_window_decorations yes

# Transparency
background_opacity 0.7

# --- Scrollback ---
scrollback_lines 20000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 1.0

# --- Clipboard ---
clipboard_control write-clipboard write-primary read-clipboard read-primary
copy_on_select yes

# --- Cursor ---
cursor_shape block
cursor_blink_interval 0

# --- Performance ---
repaint_delay 10
input_delay 1

# --- Tabs ---
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold

# --- Mouse ---
mouse_hide_wait 2.0

# --- Keybindings (зручні, не конфліктні) ---
# New window / tab
map ctrl+shift+enter new_window
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_tab

# Move between tabs
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

# Split (в kitty це "layouts")
map ctrl+shift+v     launch --location=vsplit
map ctrl+shift+h     launch --location=hsplit
map ctrl+shift+l     next_layout

# Search in scrollback
map ctrl+shift+f     search_start

# Zoom font
map ctrl+=        change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# Copy/Paste
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard
map ctrl+м     paste_from_clipboard

# --- Shell (за потреби) ---
shell zsh
